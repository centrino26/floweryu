<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Untuk Auror 🌷</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 35%,#202a49,#0a1020 55%,#03050c);color:#fff;font-family:Georgia,serif}.scene{height:100%;display:flex;justify-content:center;align-items:flex-end;position:relative}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#ffd9eb 1px,transparent 1.5px);background-size:90px 110px,140px 150px;opacity:.45}.moon{position:absolute;right:12%;top:9%;width:90px;height:90px;border-radius:50%;background:#fff5d6;box-shadow:0 0 35px #fff2c755}.moon:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;left:-23px;top:-8px;background:#111a31}.ground{position:absolute;bottom:-45px;width:120%;height:100px;border-radius:50% 50% 0 0;background:#04070e}.flower{position:relative;width:260px;height:520px;margin-bottom:15px;z-index:2;animation:sway 5s ease-in-out infinite}.stem{position:absolute;left:126px;bottom:0;width:9px;height:360px;border-radius:9px;background:linear-gradient(90deg,#173d2c,#65a96c,#173d2c);transform-origin:bottom;transform:scaleY(0);animation:grow 2s .3s forwards}.leaf{position:absolute;width:95px;height:42px;background:linear-gradient(135deg,#315f43,#75ad67);border-radius:100% 0 100% 0;opacity:0}.left{left:42px;bottom:155px;transform:rotate(-28deg) scale(0);animation:leaf .8s 1.8s forwards}.right{left:122px;bottom:225px;transform:scaleX(-1) rotate(-28deg) scale(0);animation:leaf .8s 2.1s forwards}.bud{position:absolute;left:77px;bottom:326px;width:106px;height:106px;transform:scale(.05);animation:bud 1.2s 2.35s forwards}.petal{position:absolute;left:50%;top:50%;width:64px;height:92px;border-radius:65% 65% 48% 48%;background:linear-gradient(145deg,#ffc0da,#e75c91 70%,#9e2e58);box-shadow:inset -7px -9px 13px #6e143822;opacity:0;transform-origin:50% 95%;transform:translate(-50%,-95%) rotate(var(--r)) scale(.15);animation:petal .7s var(--d) forwards}.petal:nth-child(1){--r:0deg;--d:2.65s}.petal:nth-child(2){--r:45deg;--d:2.78s}.petal:nth-child(3){--r:90deg;--d:2.91s}.petal:nth-child(4){--r:135deg;--d:3.04s}.petal:nth-child(5){--r:180deg;--d:3.17s}.petal:nth-child(6){--r:225deg;--d:3.30s}.petal:nth-child(7){--r:270deg;--d:3.43s}.petal:nth-child(8){--r:315deg;--d:3.56s}.center{position:absolute;left:50%;top:50%;width:42px;height:42px;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle at 35% 30%,#ffeaa9,#f3a944,#9b5621);box-shadow:0 0 25px #ffc25c66;animation:center .7s 3.85s forwards}.message{position:absolute;top:12%;width:90%;text-align:center;opacity:0;z-index:4;animation:message 1.4s 4.35s forwards}.message h1{margin:0;font-size:clamp(34px,5vw,56px);font-weight:normal;letter-spacing:2px;text-shadow:0 0 25px #ffb4d055}.message p{margin:14px 0 0;font-size:clamp(15px,2.2vw,21px);line-height:1.6;color:#eadfe7}.heart{color:#ff79aa;display:inline-block;animation:heart 1.3s infinite}.hint{position:absolute;bottom:24px;z-index:5;color:#ffffff66;font:12px Arial;transition:.6s}@keyframes grow{to{transform:scaleY(1)}}@keyframes leaf{to{opacity:1;transform:rotate(-28deg) scale(1)}}@keyframes bud{70%{transform:scale(1.08)}to{transform:scale(1)}}@keyframes petal{to{opacity:1;transform:translate(-50%,-95%) rotate(var(--r)) scale(1)}}@keyframes center{to{transform:translate(-50%,-50%) scale(1)}}@keyframes message{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(18px)}}@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}@keyframes heart{50%{transform:scale(1.25)}}@media(max-width:600px){.flower{transform:scale(.78);transform-origin:bottom}.moon{width:70px;height:70px}.moon:after{width:70px;height:70px}}
</style>
</head>
<body>
<div class="scene"><div class="stars"></div><div class="moon"></div><div class="message"><h1>for you <span class="heart">♥</span></h1><p>heheh<br>lucu gak</p></div><div class="flower"><div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div><div class="bud"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="center"></div></div></div><div class="ground"></div><div class="hint">tunggu sebentar... bunganya lagi mekar 🌷</div></div>
<script>setTimeout(()=>document.querySelector('.hint').style.opacity=0,5500);document.body.onclick=()=>location.reload();</script>
</body></html>
